# Test-only config so contextLoads() doesn't depend on config-server or Eureka
# being up (see testing-guidelines skill §7). Values mirror config-repo's shape.
spring.cloud.config.enabled=false
spring.config.import=
eureka.client.enabled=false

app.jwt.secret=test-only-signing-secret-at-least-32-bytes-long
app.security.public-paths=/api/auth/register,/api/auth/login
app.security.public-get-paths=/api/catalog/cakes/**
app.frontend.origin=http://localhost:3000
