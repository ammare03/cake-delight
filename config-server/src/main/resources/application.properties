server.port=8888

spring.application.name=config-server
spring.profiles.active=native
# CONFIG_REPO_PATH lets Docker/Kubernetes point this at a mounted volume
# (bind mount in Docker Compose, a ConfigMap volume in Kubernetes) without
# touching this file — locally it still resolves relative to wherever
# config-server was launched from, same as before.
spring.cloud.config.server.native.search-locations=file:///${CONFIG_REPO_PATH:${user.dir}/../config-repo}
