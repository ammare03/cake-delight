services:
  mysql:
    image: mysql:8.0
    container_name: cake-delight-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cake-delight-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cake-delight-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10


  config-server:
    build: ./config-server
    image: cake-delight/config-server:latest
    container_name: cake-delight-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      CONFIG_REPO_PATH: /config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  eureka-server:
    build: ./eureka-server
    image: cake-delight/eureka-server:latest
    container_name: cake-delight-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth-service:
    build: ./auth-service
    image: cake-delight/auth-service:latest
    container_name: cake-delight-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: mysql
      DB_PORT: "3306"
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_INSECURE_LOCAL_DEV_DEFAULT_DO_NOT_USE_FOR_ANYTHING_REAL}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    image: cake-delight/catalog-service:latest
    container_name: cake-delight-catalog-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  order-service:
    build: ./order-service
    image: cake-delight/order-service:latest
    container_name: cake-delight-order-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: mysql
      DB_PORT: "3306"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  rating-service:
    build: ./rating-service
    image: cake-delight/rating-service:latest
    container_name: cake-delight-rating-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    image: cake-delight/notification-service:latest
    container_name: cake-delight-notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: mysql
      DB_PORT: "3306"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-log}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    image: cake-delight/api-gateway:latest
    container_name: cake-delight-api-gateway
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_INSECURE_LOCAL_DEV_DEFAULT_DO_NOT_USE_FOR_ANYTHING_REAL}
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      rating-service:
        condition: service_started
      notification-service:
        condition: service_started

  frontend-service:
    build:
      context: ./frontend-service
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:9090/api}
    image: cake-delight/frontend-service:latest
    container_name: cake-delight-frontend-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  mysql-data:
