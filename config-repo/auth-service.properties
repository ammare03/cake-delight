server.port=8081

# Local dev MySQL-compatible instance (shared across this machine's projects).
# Prefixed schema name to avoid colliding with unrelated auth_db schemas that
# already exist on this same instance from other coursework.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/cake_delight_auth_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# DEV ONLY — use validate/none in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# app.jwt.* now lives in config-repo/application.properties (shared) —
# the gateway needs the same secret to validate tokens it didn't issue.
