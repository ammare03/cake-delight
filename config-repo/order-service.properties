server.port=8083

# Local dev MySQL-compatible instance (shared across this machine's projects).
# Prefixed schema name — same reasoning as auth-service.properties. Already
# created by docker/mysql-init/001-init-schemas.sql.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/cake_delight_order_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# DEV ONLY — use validate/none in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# spring.kafka.bootstrap-servers and the order-completed topic name live in
# the shared application.properties — notification-service needs the same
# values on the consumer side. Producer-specific settings only, here.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Don't leak the producer's Java package/class name into the message headers —
# notification-service deserializes into its own copy of the event DTO
# (CLAUDE.md §10 — no shared domain-model JAR), so the two class names differ.
spring.kafka.producer.properties.spring.json.add.type.headers=false
