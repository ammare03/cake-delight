server.port=8084

# Local dev MySQL-compatible instance (shared across this machine's projects).
# Prefixed schema name — same reasoning as auth-service.properties.
spring.datasource.url=jdbc:mysql://localhost:3309/cake_delight_rating_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# DEV ONLY — use validate/none in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
