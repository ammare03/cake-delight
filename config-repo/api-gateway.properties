server.port=9090

# /api/auth/** -> auth-service, resolved via Eureka (lb://). StripPrefix=1
# removes the leading /api segment so it lands on auth-service's own
# /auth/register, /auth/login mappings.
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# /api/catalog/** -> catalog-service, resolved via Eureka (lb://). Same
# StripPrefix=1 pattern as auth-service above, lands on catalog-service's
# own /catalog/cakes mappings.
spring.cloud.gateway.server.webmvc.routes[1].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/catalog/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# /api/ratings/** -> rating-service. No public-paths/public-get-paths entry —
# unlike catalog, every rating-service endpoint (including the GET list and
# GET summary) requires a valid token per CLAUDE.md §4's public-routes list,
# which doesn't mention ratings at all.
spring.cloud.gateway.server.webmvc.routes[2].id=rating-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://rating-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/ratings/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Routes reachable without a JWT regardless of HTTP method — see CLAUDE.md §4.
app.security.public-paths=/api/auth/register,/api/auth/login

# Routes reachable without a JWT for GET only (browsing); POST/PUT/DELETE on
# the same path still require a valid token, and catalog-service itself
# enforces the ADMIN-only check for those via X-User-Role — the gateway only
# proves identity, not authorization (CLAUDE.md §4).
app.security.public-get-paths=/api/catalog/cakes/**
