server.port=8082

# Local dev MySQL-compatible instance (shared across this machine's projects).
# Prefixed schema name to avoid colliding with unrelated catalog_db schemas —
# same reasoning as auth-service.properties.
spring.datasource.url=jdbc:mysql://localhost:3309/cake_delight_catalog_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# DEV ONLY — use validate/none in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# data.sql seeds ~12 sample cakes on every startup (CLAUDE.md §5.2). Hibernate
# creates/updates the schema from the entity first (defer-datasource-init),
# and sql.init.mode=always is required because MySQL isn't an embedded DB —
# Boot only auto-runs data.sql for embedded DBs (H2/Derby) by default.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
