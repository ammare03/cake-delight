eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Shared HS256 signing secret — auth-service issues tokens, api-gateway
# validates them; both need the same value. Local dev only — move to an
# env var / Kubernetes Secret in Phase 6.
app.jwt.secret=${JWT_SECRET:CHANGE_ME_INSECURE_LOCAL_DEV_DEFAULT_DO_NOT_USE_FOR_ANYTHING_REAL}
app.jwt.expiration-ms=86400000
app.jwt.issuer=cake-delight
