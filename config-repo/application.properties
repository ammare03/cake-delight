eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Shared HS256 signing secret — auth-service issues tokens, api-gateway
# validates them; both need the same value. Local dev only — move to an
# env var / Kubernetes Secret in Phase 6.
app.jwt.secret=${JWT_SECRET:CHANGE_ME_INSECURE_LOCAL_DEV_DEFAULT_DO_NOT_USE_FOR_ANYTHING_REAL}
# 1 hour. Generated once at login, nothing stored server-side — after this the
# user just logs in again, there's no refresh token.
app.jwt.expiration-ms=3600000

# Single local broker (docker-compose: zookeeper + kafka, CLAUDE.md §7 Phase 4).
# Shared here because order-service (producer) and notification-service
# (consumer) both need the identical broker address and topic name —
# producer/consumer-specific serializer settings stay in each service's own
# config-repo/<service>.properties.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.order-completed=order.completed

# Applies to every Feign client project-wide (order-service->catalog-service,
# rating-service->order-service) — Resilience4j circuit breakers are
# deliberately out of scope for this capstone (CLAUDE.md §3), but a call
# with no timeout at all can hang a request indefinitely if the downstream
# service is slow rather than down outright. This is the cheap mitigation
# the architecture baseline calls for in place of a circuit breaker.
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=5000
