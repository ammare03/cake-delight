server.port=8085

# Local dev MySQL-compatible instance (shared across this machine's projects).
# Prefixed schema name — same reasoning as auth-service.properties. Already
# created by docker/mysql-init/001-init-schemas.sql.
spring.datasource.url=jdbc:mysql://localhost:3309/cake_delight_notification_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# DEV ONLY — use validate/none in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# spring.kafka.bootstrap-servers and the order-completed topic name live in
# the shared application.properties — order-service (producer) needs the
# same values. Consumer-specific settings only, here.
spring.kafka.consumer.group-id=notification-service

# Wrapped in ErrorHandlingDeserializer rather than pointed at
# StringDeserializer/JsonDeserializer directly: a malformed or
# incompatible message would otherwise throw during deserialization itself
# (before the listener even runs), which is the "poison message" case the
# audit's Kafka pitfalls call out — this way the container's error handler
# gets a chance to log and skip it instead. The real (de)serializers move
# to "delegate" properties below.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# order-service disables type headers on send (its own package/class name
# would leak into them and mean nothing here — CLAUDE.md §10, no shared
# domain-model JAR) — so this side has to be told what to deserialize into
# instead of reading it off the message.
spring.kafka.consumer.properties.spring.json.value.default.type=com.cakedelight.notificationservice.event.OrderCompletedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.cakedelight.notificationservice.event
# Replay from the start of the topic the first time this consumer group
# connects — acceptable for local dev with a single consumer; a production
# deployment would think harder about this default.
spring.kafka.consumer.auto-offset-reset=earliest
