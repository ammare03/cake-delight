server.port=8085

# Local dev MySQL-compatible instance (shared across this machine's projects).
# Prefixed schema name — same reasoning as auth-service.properties. Already
# created by docker/mysql-init/001-init-schemas.sql.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/cake_delight_notification_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# DEV ONLY — use validate/none in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# spring.kafka.bootstrap-servers and the order-completed topic name live in
# the shared application.properties — order-service (producer) needs the
# same values. Consumer-specific settings only, here.
spring.kafka.consumer.group-id=notification-service

# Wrapped in ErrorHandlingDeserializer rather than pointed at
# StringDeserializer/JsonDeserializer directly: a malformed or
# incompatible message would otherwise throw during deserialization itself
# (before the listener even runs), which is the "poison message" case the
# audit's Kafka pitfalls call out — this way the container's error handler
# gets a chance to log and skip it instead. The real (de)serializers move
# to "delegate" properties below.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# order-service disables type headers on send (its own package/class name
# would leak into them and mean nothing here — CLAUDE.md §10, no shared
# domain-model JAR) — so this side has to be told what to deserialize into
# instead of reading it off the message.
spring.kafka.consumer.properties.spring.json.value.default.type=com.cakedelight.notificationservice.service.OrderCompletedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.cakedelight.notificationservice.service
# Replay from the start of the topic the first time this consumer group
# connects — acceptable for local dev with a single consumer; a production
# deployment would think harder about this default.
spring.kafka.consumer.auto-offset-reset=earliest

# Real email sending (task #11) — Gmail SMTP, authenticated with an App
# Password (requires 2-Step Verification on the sending account; a regular
# Google account password will NOT work here). spring.mail.username is not
# a secret (it's just the sender address) so it's fine as a literal default;
# spring.mail.password MUST come from the SMTP_PASSWORD environment
# variable — never write the app password into this file or commit it
# (CLAUDE.md §10). See README's "Real email notifications" section for how
# to set SMTP_PASSWORD locally (IntelliJ run config or shell env var).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:cakedelight.donotreply@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# The address that appears in the "From" header. Same value as
# spring.mail.username today (Gmail requires the authenticated account to
# be the From address unless you've configured "Send mail as" delegation),
# kept as its own property because those two properties mean different
# things even though they currently share a value.
app.notification.email.from=${SMTP_USERNAME:cakedelight.donotreply@gmail.com}

# Which NotificationSender implementation is active: "email" (real Gmail
# SMTP send, the default) or "log" (console-only, no SMTP credentials
# needed — useful for local development without touching real email, or if
# SMTP_PASSWORD isn't set yet). See NotificationSender's Spring
# @ConditionalOnProperty wiring.
app.notification.channel=${NOTIFICATION_CHANNEL:email}

# Spring Boot auto-configures a MailHealthIndicator whenever spring.mail.*
# properties are present, and it drags the WHOLE /actuator/health response
# to DOWN if it can't authenticate to Gmail — which defeats the entire
# point of the NOTIFICATION_CHANNEL=log fallback above: an evaluator
# running without SMTP credentials would see this service (and its
# Kubernetes readiness/liveness/startup probes, all of which check
# /actuator/health) report unhealthy even though the app is working exactly
# as designed. The NotificationSender abstraction already records a
# per-notification SENT/FAILED outcome (D-86), which is the correct place
# for "could we reach Gmail?" to live — the aggregate health endpoint isn't
# it. Discovered live during the Phase 6 Kubernetes deployment (the probes
# made the failure impossible to miss); the same auto-configuration was
# already present, just unobserved, in every earlier phase.
management.health.mail.enabled=false
