# Zookeeper + Kafka — Phase 6. Same images/settings as docker-compose.yml,
# simplified to a single internal listener: unlike Compose (where some
# services could still run on the host), every Cake Delight service is a
# pod in-cluster now, so there's no separate host-facing listener to
# maintain — everything reaches Kafka at kafka:9092 (the plain Service DNS
# name), matching KAFKA_BOOTSTRAP_SERVERS in the shared ConfigMap.
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: cake-delight
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.1
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          ports:
            - containerPort: 2181
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: cake-delight
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            # Explicit, modest heap so the JVM doesn't size itself off
            # container memory ergonomics and get OOMKilled — the default
            # sizing plus off-heap usage (metaspace, direct buffers, page
            # cache pressure) didn't comfortably fit the original 1Gi limit
            # in testing on this cluster.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
          ports:
            - containerPort: 9092
          # A TCP check, not an exec probe running kafka-broker-api-versions:
          # that command spins up a brand new JVM admin client on every
          # probe (every 10s by default), stacking a second JVM's memory on
          # top of the broker's own inside the same container — observed
          # causing repeated OOMKills in testing on this cluster. A TCP
          # check only confirms the listener is accepting connections,
          # which is enough to know the broker is up, at effectively zero
          # cost.
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
