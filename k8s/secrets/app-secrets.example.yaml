# Template only — copy to app-secrets.yaml and fill in real values if you
# prefer a declarative Secret manifest. app-secrets.yaml (anything except
# this *.example.yaml file) is git-ignored so a real secret can never be
# committed by accident.
#
# The PRIMARY, recommended path is the imperative command in the root
# README's "Secrets" section instead — it never touches disk:
#
#   kubectl create secret generic cake-delight-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=SMTP_PASSWORD="" \
#     -n cake-delight
#
# Both secrets here are optional in the sense that the stack still boots
# and demonstrates the full flow without them — see the README for exactly
# what each one is for and why SMTP_PASSWORD in particular is fundamentally
# different from JWT_SECRET (one is a real external credential, the other
# is any random string).
apiVersion: v1
kind: Secret
metadata:
  name: cake-delight-secrets
  namespace: cake-delight
type: Opaque
stringData:
  # Any random string works — only auth-service and api-gateway need to
  # agree on it, and nothing external ever checks it. Generate your own:
  #   openssl rand -base64 32
  JWT_SECRET: "REPLACE_WITH_YOUR_OWN_GENERATED_SECRET_DO_NOT_USE_THIS_LITERAL_VALUE"
  # A real Gmail App Password for your own sending account. Leave this
  # empty (as below) to run with NOTIFICATION_CHANNEL=log instead — the
  # order -> notification flow still works end to end, it just records
  # notifications rather than emailing them.
  SMTP_PASSWORD: ""
