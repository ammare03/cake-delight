apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: cake-delight
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      enableServiceLinks: false
      containers:
        - name: auth-service
          image: cake-delight/auth-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cake-delight-env
            - secretRef:
                name: cake-delight-secrets
          ports:
            - containerPort: 8081
          # Gates readiness/liveness until the app has actually finished
          # starting — Spring Boot's context init genuinely took 2+ minutes
          # under CPU contention from many concurrent JVM startups on this
          # cluster, well past what a bare livenessProbe's initialDelay
          # tolerated, which was killing pods mid-startup (see the identical
          # comment/pattern repeated across every Spring service manifest).
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          # Limit sized above the request deliberately (standard JVM-in-k8s
          # sizing): a Spring Boot 4 + Hibernate JVM's startup phase (class
          # loading, JIT warmup) spikes well above its steady-state memory,
          # and an OOMKill during that spike was observed at the original
          # 512Mi limit in testing on this cluster. The same pattern is
          # repeated identically across every Spring service manifest.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
